# SPDX-License-Identifier: GPL-3.0-only

name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longlineage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-history-hygiene:
    name: repository-history-hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every blob introduced by this ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          scripts/ci/check_history_hygiene.sh "$base" HEAD

  presentation-browser-qa:
    name: presentation-browser-qa
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned browser QA dependencies
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install --disable-pip-version-check \
            playwright==1.60.0 \
            greenlet==3.2.4 \
            pyee==13.0.0 \
            typing_extensions==4.15.0
          python3 -m playwright install --with-deps chromium
      - name: Verify committed standalone reports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          reports=(
            "docs/reports/20260720_HCC1395完整科學運算與parity報告_01.html"
            "docs/reports/20260721_HCC1395_Python相容區域拓撲驗證報告_01.html"
          )
          for report in "${reports[@]}"; do
            stem="$(basename "${report%.html}")"
            python3 presentation/qa_static_report.py \
              --html "$report" \
              --evidence-dir "$RUNNER_TEMP/browser-qa/$stem" \
              --receipt "$RUNNER_TEMP/browser-qa/$stem.receipt.json"
          done

  synthetic-build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            cxx: g++
            build_type: Debug
            sanitizers: ""
            tsan: false
          - name: clang-debug
            cxx: clang++
            build_type: Debug
            sanitizers: ""
            tsan: false
          - name: gcc-release
            cxx: g++
            build_type: Release
            sanitizers: ""
            tsan: false
          - name: clang-release
            cxx: clang++
            build_type: Release
            sanitizers: ""
            tsan: false
          - name: clang-asan-ubsan
            cxx: clang++
            build_type: Debug
            sanitizers: address,undefined
            tsan: false
          - name: gcc-tsan-p2
            cxx: g++
            build_type: Debug
            sanitizers: thread
            tsan: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang clang-format-14 cmake curl jq libboost-dev libbz2-dev libdeflate-dev \
            libjansson-dev liblzma-dev libssl-dev pkg-config strace zlib1g-dev
          sudo apt-get install -y --no-install-recommends python3-jsonschema
          test -x /usr/bin/cmake
          /usr/bin/cmake --version

      - name: Build pinned HTSlib
        env:
          HTSLIB_VERSION: "1.18"
          HTSLIB_SHA256: f1ab53a593a2320a1bfadf4ef915dae784006c5b5c922c8a8174d7530a9af18f
        run: |
          curl -fsSLo "/tmp/htslib-${HTSLIB_VERSION}.tar.bz2" \
            "https://github.com/samtools/htslib/releases/download/${HTSLIB_VERSION}/htslib-${HTSLIB_VERSION}.tar.bz2"
          echo "${HTSLIB_SHA256}  /tmp/htslib-${HTSLIB_VERSION}.tar.bz2" | sha256sum -c -
          tar -xf "/tmp/htslib-${HTSLIB_VERSION}.tar.bz2" -C /tmp
          cd "/tmp/htslib-${HTSLIB_VERSION}"
          ./configure --prefix=/usr/local --disable-libcurl --disable-plugins --with-libdeflate
          make -j4
          sudo make install
          sudo ldconfig

      - name: Check C++ formatting
        if: matrix.name == 'gcc-debug'
        run: scripts/ci/check_format.sh clang-format-14

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: |
          /usr/bin/cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLONGLINEAGE_BUILD_TESTS=ON \
            -DLONGLINEAGE_BUILD_BENCHMARKS=ON \
            -DLONGLINEAGE_REQUIRE_EXACT_HTSLIB=ON \
            -DLONGLINEAGE_WARNINGS_AS_ERRORS=ON \
            -DLONGLINEAGE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: /usr/bin/cmake --build build --parallel 4

      - name: Synthetic tests and governance under network syscall denial
        if: matrix.tsan == false
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: scripts/ci/check_all.sh build

      - name: P2 concurrency contracts under ThreadSanitizer
        if: matrix.tsan == true
        env:
          LD_LIBRARY_PATH: /usr/local/lib
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: ctest --test-dir build --output-on-failure -R '^p2_'

  pinned-container:
    name: pinned-container
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify dependency lock
        run: scripts/ci/check_dependency_lock.sh
      - name: Build pinned production image
        run: |
          verify_source_binding() {
            actual_commit="$(git rev-parse --verify HEAD)"
            test "$actual_commit" = "$GITHUB_SHA"
            git cat-file -e "${GITHUB_SHA}^{commit}"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          }
          verify_source_binding
          docker build \
            --build-arg LONGLINEAGE_GIT_COMMIT="${GITHUB_SHA}" \
            --file containers/Dockerfile \
            --tag longlineage:ci \
            .
          verify_source_binding
      - name: Verify resolved package manifests
        run: |
          docker image inspect longlineage:ci --format 'IMAGE_ID={{.Id}}'
          docker run --rm --network none --entrypoint /bin/sh longlineage:ci -c \
            'set -eu
             validate_manifest() {
               file="$1"
               test -s "$file"
               LC_ALL=C sort -c "$file"
               awk -F "\t" "NF != 2 || \$1 == \"\" || \$2 == \"\" { exit 1 }" "$file"
               test "$(cut -f1 "$file" | LC_ALL=C sort | uniq -d | wc -l)" -eq 0
               printf "PACKAGE_MANIFEST path=%s rows=%s sha256=%s\n" \
                 "$file" "$(wc -l < "$file")" "$(sha256sum "$file" | cut -d " " -f1)"
             }
             builder=/opt/longlineage/share/provenance/builder-apt-packages.tsv
             runtime=/opt/longlineage/share/provenance/runtime-apt-packages.tsv
             validate_manifest "$builder"
             validate_manifest "$runtime"
             live="$(mktemp)"
             dpkg-query -W -f="\${binary:Package}\t\${Version}\n" | LC_ALL=C sort > "$live"
             cmp "$runtime" "$live"
             echo "RUNTIME_MANIFEST_LIVE_DPKG_MATCH=PASS"'
      - name: Smoke CLI
        run: docker run --rm --network none longlineage:ci --version
